name: build-cli

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact: phi-linux-amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            artifact: phi-darwin-arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            artifact: phi-windows-amd64.exe
    runs-on: ${{ matrix.os }}
    env:
      PHI_CACHE: ${{ runner.temp }}/phi-dependencies
      PHI_TEST_CACHE: ${{ runner.temp }}/phi-dependencies
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache verified grading dependencies
        shell: bash
        run: |
          go run . init 12 "${{ runner.temp }}/phi-grading-example"
          go run . check 12 "${{ runner.temp }}/phi-grading-example"
      - name: Test
        run: go test ./...
      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o "dist/${{ matrix.artifact }}" .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
